<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#07070a">
<meta name="description" content="बिना धुएं और बिना प्रदूषण के डिजिटल पटाखे चलाएं! Ladi, Phuljhadi, Chakri, Rocket और Bomb को ऑनलाइन लाइट करें।">
<title>Pollution Free Diwali 🌳 - Interactive Eco-Friendly Fireworks</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="sky"></canvas>
<canvas id="props"></canvas>

<header class="top">
  <h1>Pollution Free Diwali 🌳</h1>
</header>

<main>
  <section class="hero">
    <h2 class="hero-title">Happy <em>Diwali.</em></h2>
    <p class="tap-hint">TAP TO LIGHT UP THE NIGHT</p>
  </section>

  <section class="picker">
    <div class="picker-head">
      <h2>Choose a firework</h2>
      <button class="btn gold" id="lightAll">Light them all</button>
    </div>
    <div class="cards" id="cards">
      <button class="card" data-type="sparkler"><span class="ico">🎇</span><h3>Ladi</h3><small>Light up</small></button>
      <button class="card" data-type="fountain"><span class="ico">⛲</span><h3>Phuljhadi</h3><small>Light up</small></button>
      <button class="card" data-type="spinner"><span class="ico">🌀</span><h3>Chakri</h3><small>Light up</small></button>
      <button class="card" data-type="rocket"><span class="ico">🚀</span><h3>Rocket</h3><small>Launch</small></button>
      <button class="card" data-type="bomb"><span class="ico">💣</span><h3>Bomb</h3><small>Launch</small></button>
      <button class="card pro" data-type="pro"><span class="ico">🎆</span><h3>Best Fireworks <span class="badge">👑 Pro</span></h3><small>Launch</small></button>
    </div>
  </section>
</main>


<footer class="foot">Made with Love <span class="heart">❤️</span> by R@nveer</footer>

<script src="script.js"></script>
</body>
</html>
